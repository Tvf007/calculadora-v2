<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora de Preço - Padaria Freitas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
      flex-direction: column;
    }

    .container {
      flex: 1;
      padding: 20px;
      box-sizing: border-box;
      border-bottom: 1px solid #ddd;
    }

    .sidebar {
      flex: 1;
      padding: 20px;
      box-sizing: border-box;
    }

    input, button {
      margin: 10px 0;
      padding: 8px;
      width: 100%;
      box-sizing: border-box;
      transition: transform 0.1s ease-in-out;
    }

    button {
      cursor: pointer;
      border: none;
      color: white;
      font-size: 1em;
    }

    button:active {
      transform: scale(0.95);
    }

    .ocr-buttons-group {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .ocr-buttons-group button {
      flex: 1;
      margin: 0;
      font-weight: bold;
      border-radius: 6px;
      padding: 12px;
      font-size: 0.95em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .camera-btn {
      background: linear-gradient(135deg, #4b6cb7 0%, #182848 100%);
      color: white;
    }

    .camera-btn:hover {
      background: linear-gradient(135deg, #3b5998 0%, #0f1b33 100%);
    }

    .gallery-btn {
      background: linear-gradient(135deg, #6f42c1 0%, #4527a0 100%);
      color: white;
    }

    .gallery-btn:hover {
      background: linear-gradient(135deg, #5e35b1 0%, #311b92 100%);
    }

    .ocr-status {
      margin: 5px 0 15px 0;
      padding: 10px 14px;
      border-radius: 6px;
      background-color: #f0f4f8;
      border: 1px solid #cbd5e1;
      font-size: 0.9em;
      color: #334155;
    }

    .ocr-progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #cbd5e1;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }

    .ocr-progress-bar {
      height: 100%;
      width: 0%;
      background-color: #2563eb;
      transition: width 0.2s ease-in-out;
    }

    .ocr-items-container {
      margin-bottom: 15px;
      padding: 10px;
      background: #f8fafc;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      font-size: 0.9em;
    }

    .ocr-items-title {
      font-weight: bold;
      color: #1e3a8a;
      margin-bottom: 8px;
    }

    .ocr-item-chip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      margin-top: 6px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .ocr-item-chip:hover {
      background: #eff6ff;
      border-color: #2563eb;
    }

    .product-list {
      list-style-type: none;
      padding: 0;
    }

    .product-item {
      display: flex;
      flex-direction: column;
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #e6ffe6;
    }

    .delete-btn {
      background-color: #ff4d4d;
      padding: 3px 8px;
      font-size: 12px;
      align-self: flex-end;
    }

    .save-btn {
      background-color: #28a745;
    }

    .clear-btn {
      background-color: #dc3545;
    }

    .add-product-btn {
      background-color: #28a745;
    }

    .price-green {
      color: green;
      font-weight: bold;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 20px;
      background-color: #581d22;
      padding: 15px;
      border-radius: 8px;
    }

    .logo-container img {
      max-width: 60%;
      height: auto;
      border: 2px solid #ddd;
      border-radius: 5px;
      margin: 0 auto;
    }

    .logo-container h2,
    .logo-container p {
      color: white;
      margin: 5px 0;
    }

    .controls-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .controls-container button {
      padding: 5px 10px;
      font-size: 0.9em;
    }

    @media (min-width: 768px) {
      body {
        flex-direction: row;
      }

      .container {
        border-right: 1px solid #ddd;
        border-bottom: none;
      }

      .sidebar {
        border-left: 1px solid #ddd;
      }

      .logo-container img {
        max-width: 40%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <h2>Calculadora de Preço</h2>
      <p>Padaria Freitas</p>
    </div>

    <!-- Botões de Câmera e Galeria para OCR -->
    <div class="ocr-buttons-group">
      <button type="button" class="camera-btn" onclick="abrirLeitorCamera()">📷 Tirar Foto</button>
      <button type="button" class="gallery-btn" onclick="abrirLeitorGaleria()">🖼️ Escolher da Galeria</button>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="processarImagemOCR(event)" />
    <input type="file" id="galleryInput" accept="image/*" style="display: none;" onchange="processarImagemOCR(event)" />
    
    <div id="ocrStatus" class="ocr-status" style="display: none;"></div>
    <div id="ocrItemsContainer" class="ocr-items-container" style="display: none;"></div>

    <input type="text" id="produto" placeholder="Nome do produto" />
    <input type="text" id="precoCusto" placeholder="Preço de custo (R$)" />
    <input type="number" id="quantidade" placeholder="Quantidade" />
    <button class="add-product-btn" onclick="adicionarProduto()">Adicionar Produto</button>
    <ul class="product-list" id="listaProdutos"></ul>
  </div>
  <div class="sidebar">
    <div class="controls-container">
      <button class="save-btn" onclick="salvarProdutos()">Salvar Lista</button>
      <button class="clear-btn" onclick="limparLista()">Limpar Lista</button>
    </div>
  </div>

  <!-- Áudio do cadastro -->
  <audio id="somCadastro" src="sucesso.mp3" preload="auto"></audio>

  <script>
    const precoCustoInput = document.getElementById("precoCusto");

    precoCustoInput.addEventListener("input", function (e) {
      let valor = e.target.value.replace(/\D/g, "");
      if (!valor) return;
      valor = (parseInt(valor, 10) / 100).toFixed(2);
      e.target.value = "R$" + valor.replace(".", ",");
    });

    function parsePreco(precoFormatado) {
      return parseFloat(precoFormatado.replace("R$", "").replace(".", "").replace(",", ".")) || 0;
    }

    function calcularPrecoVenda(precoCusto, quantidade) {
      const precoPorUnidade = precoCusto / (quantidade || 1);
      let precoVenda;

      if (precoPorUnidade <= 5) {
        precoVenda = precoPorUnidade * 1.75;
      } else {
        precoVenda = precoPorUnidade * 1.5;
      }

      precoVenda = Math.ceil(precoVenda * 4) / 4; // múltiplo de 0,25
      return precoVenda;
    }

    function adicionarProduto() {
      const nomeProduto = document.getElementById("produto").value.trim();
      const precoCustoFormatado = document.getElementById("precoCusto").value.trim();
      const quantidade = parseInt(document.getElementById("quantidade").value.trim()) || 1;

      if (!nomeProduto || !precoCustoFormatado) {
        alert("Por favor, preencha todos os campos.");
        return;
      }

      const precoCusto = parsePreco(precoCustoFormatado);
      const precoVenda = calcularPrecoVenda(precoCusto, quantidade);

      const item = document.createElement("li");
      item.className = "product-item";
      item.innerHTML = `
        <strong>${nomeProduto}</strong>
        <span>Preço de Custo: <strong>R$ ${precoCusto.toFixed(2).replace(".", ",")}</strong></span>
        <span>Quantidade: ${quantidade}</span>
        <span>Preço de Venda: <span class="price-green">R$ ${precoVenda.toFixed(2).replace(".", ",")}</span></span>
        <button class="delete-btn" onclick="this.parentElement.remove()">Remover</button>
      `;

      const lista = document.getElementById("listaProdutos");
      lista.insertBefore(item, lista.firstChild); // adiciona no topo da lista

      // Reproduzir som
      const som = document.getElementById("somCadastro");
      som.currentTime = 0;
      som.play();

      document.getElementById("produto").value = "";
      document.getElementById("precoCusto").value = "";
      document.getElementById("quantidade").value = "";
    }

    function salvarProdutos() {
      const lista = document.getElementById("listaProdutos").innerHTML;
      localStorage.setItem("produtosPadaria", lista);
      alert("Lista salva com sucesso!");
    }

    function limparLista() {
      if (confirm("Tem certeza que deseja limpar a lista?")) {
        document.getElementById("listaProdutos").innerHTML = "";
        localStorage.removeItem("produtosPadaria");
      }
    }

    // --- Lazy Loading do Tesseract.js e Lógica do OCR ---
    let scriptTesseractPromise = null;
    let itensDetectadosOCR = [];

    function carregarTesseractJS() {
      if (window.Tesseract) {
        return Promise.resolve();
      }
      if (scriptTesseractPromise) {
        return scriptTesseractPromise;
      }
      scriptTesseractPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
        script.async = true;
        script.onload = () => resolve();
        script.onerror = () => {
          scriptTesseractPromise = null;
          reject(new Error("Falha ao carregar biblioteca Tesseract.js via CDN"));
        };
        document.head.appendChild(script);
      });
      return scriptTesseractPromise;
    }

    function abrirLeitorCamera() {
      carregarTesseractJS().catch(err => console.warn("Carregando Tesseract...", err));
      document.getElementById("cameraInput").click();
    }

    function abrirLeitorGaleria() {
      carregarTesseractJS().catch(err => console.warn("Carregando Tesseract...", err));
      document.getElementById("galleryInput").click();
    }

    async function processarImagemOCR(event) {
      const fileInput = event.target;
      const file = fileInput.files[0];
      if (!file) return;

      const statusDiv = document.getElementById("ocrStatus");
      const itemsDiv = document.getElementById("ocrItemsContainer");
      
      itemsDiv.style.display = "none";
      itemsDiv.innerHTML = "";
      statusDiv.style.display = "block";
      statusDiv.innerHTML = `
        <div id="ocrStatusText">⌛ Carregando leitor de imagem (Tesseract.js)...</div>
        <div class="ocr-progress-bar-bg"><div id="ocrProgressBar" class="ocr-progress-bar"></div></div>
      `;

      let worker = null;

      try {
        // 1. Carrega dinamicamente a biblioteca se ainda não estiver carregada (timeout 15s)
        const timeoutScript = new Promise((_, reject) =>
          setTimeout(() => reject(new Error("O download do script Tesseract.js demorou demais (timeout 15s).")), 15000)
        );
        await Promise.race([carregarTesseractJS(), timeoutScript]);

        const statusElem = document.getElementById("ocrStatusText");
        if (statusElem) statusElem.innerText = "⌛ Baixando modelo de linguagem em português (por)...";

        // 2. Executa a criação do worker e o OCR com timeout limite de 25 segundos
        const promiseOCR = (async () => {
          worker = await Tesseract.createWorker('por', 1, {
            logger: m => {
              if (m.status === 'recognizing text') {
                const pct = Math.round((m.progress || 0) * 100);
                const textElem = document.getElementById("ocrStatusText");
                const barElem = document.getElementById("ocrProgressBar");
                if (textElem) textElem.innerText = `🔍 Reconhecendo texto... (${pct}%)`;
                if (barElem) barElem.style.width = `${pct}%`;
              } else if (m.status) {
                const textElem = document.getElementById("ocrStatusText");
                if (textElem) textElem.innerText = `⚙️ ${m.status}...`;
              }
            }
          });
          const res = await worker.recognize(file);
          return res;
        })();

        const timeoutOCR = new Promise((_, reject) =>
          setTimeout(() => reject(new Error("Tempo limite excedido ao carregar modelo ou processar imagem (timeout 25s).")), 25000)
        );

        const ret = await Promise.race([promiseOCR, timeoutOCR]);

        const textoReconhecido = ret.data ? ret.data.text || "" : "";
        console.log("Texto OCR reconhecido:", textoReconhecido);

        itensDetectadosOCR = parseOrcamentoTexto(textoReconhecido);

        if (itensDetectadosOCR.length > 0) {
          statusDiv.innerHTML = `✅ <strong>${itensDetectadosOCR.length} item(ns) encontrado(s) na nota!</strong>`;
          preencherFormulario(itensDetectadosOCR[0]);

          if (itensDetectadosOCR.length > 1) {
            exibirListaItensOCR(itensDetectadosOCR);
          }
        } else {
          statusDiv.innerHTML = `⚠️ Não foi possível identificar produtos na imagem. Tente com uma foto mais legível ou com melhor iluminação.`;
        }
      } catch (err) {
        console.error("Erro no processamento OCR:", err);
        statusDiv.innerHTML = `
          <div style="color: #dc3545; font-weight: bold;">❌ Não foi possível carregar o leitor OCR.</div>
          <div style="font-size: 0.85em; margin-top: 4px; color: #555;">
            O download dos dados de idioma ('por') demorou demais ou houve falha na conexão de rede.
          </div>
          <button type="button" onclick="abrirLeitorCamera()" style="margin-top: 8px; padding: 6px 12px; background-color: #2563eb; color: white; border-radius: 4px; cursor: pointer;">🔄 Tentar Novamente</button>
        `;
      } finally {
        if (worker) {
          try {
            await worker.terminate();
          } catch (e) {}
        }
        fileInput.value = ""; // reseta os inputs file
        const galleryInput = document.getElementById("galleryInput");
        if (galleryInput) galleryInput.value = "";
      }
    }

    // ============================================================
    //  PARSER OCR - 3 TIPOS DE DOCUMENTOS
    //  1. Orçamento em Tabela (código | qtd | produto | und | vl.unit | vl.total)
    //  2. Cupom Térmico de Distribuidora (2 linhas: descrição + qtd x preço)
    //  3. Notas de Construção / Lojas (ignora cabeçalho e rodapé)
    // ============================================================

    // Palavras-chave para ignorar linhas de cabeçalho / rodapé
    const LINHAS_IGNORAR = [
      "BUZIM DISTRIBUIDORA", "VENDA SIMPLES", "NAO E DOCUMENTO FISCAL", "NÃO É DOCUMENTO FISCAL",
      "ORÇAMENTO", "ORCAMENTO", "PEDIDO", "PROPOSTA",
      "CLIENTE", "VENDEDOR", "EMITIDO", "EMISSAO", "EMISSÃO",
      "SUBTOTAL", "TOTAL GERAL", "VALOR TOTAL", "VALOR PAGO", "TROCO",
      "DINHEIRO", "CARTAO", "CARTÃO", "PIX", "RECEBIDO",
      "FORMA DE PAGAMENTO", "DADOS PARA ENTREGA",
      "DESCONTO", "ACRESCIMO", "ACRÉSCIMO",
      "CNPJ", "CPF", "INSCRICAO", "INSCRIÇÃO", "IE ", "TELEFONE", "FAX",
      "ENDERECO", "ENDEREÇO", "BAIRRO", "CIDADE", "CEP", "UF ",
      "DATA ", "HORA ", "CHAVE NF", "CHAVE DE ACESSO",
      "TRIBUTOS", "VALOR APROX", "COFINS", "ICMS", "PIS",
      "OBRIGADO", "VOLTE SEMPRE", "BOA COMPRA",
      "NOTA FISCAL", "NFE", "NF-E", "CUPOM FISCAL",
      "ITEM DESCRICAO", "ITEM DESCRIÇÃO", "QTD UN VL",
      "VL.UNIT", "VLR.UNIT", "VL.TOTAL", "VLR.TOTAL",
      "CODIGO", "CÓDIGO", "PRECO UNIT", "PREÇO UNIT",
      "COMPR.", "COMPROVANTE", "CARIMBO", "ASSINATURA", "FATURA"
    ];

    // Unidades de embalagem (caixa/fardo) que implicam em subdivisão de custo
    const UNIDADES_EMBALAGEM = new Set(["CX", "FD", "BL", "PC", "PT", "PCT", "CAIXA", "FARDO", "PACOTE", "BLOCO"]);
    // Unidades de venda direta (sem subdivisão)
    const UNIDADES_VENDA_DIRETA = new Set(["UN", "UD", "UNID", "KG", "GR", "M2", "M", "L", "LT", "LITRO", "ML"]);

    function deveIgnorarLinha(lineUpper) {
      // Ignora linhas puramente numéricas / de separação
      if (/^[\-=_*#|\s]+$/.test(lineUpper)) return true;
      // Ignora linhas que são somente CNPJ / telefone / data
      if (/^\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/.test(lineUpper)) return true; // CNPJ
      if (/^\(\d{2}\)\s*\d{4,5}/.test(lineUpper)) return true;               // telefone
      if (/^\d{2}\/\d{2}\/\d{4}/.test(lineUpper)) return true;               // data
      // Ignora linhas que batem com palavras-chave de cabeçalho/rodapé
      return LINHAS_IGNORAR.some(term => lineUpper.includes(term));
    }

    // ---- Extrai o multiplicador de unidades dentro da embalagem ----
    // Ex: "C/12 UD" → 12, "C/15" → 15, "10X120G" → 10, "24X30G" → 24
    function extrairMultiplicador(str) {
      if (!str) return 1;
      const s = str.toUpperCase();
      // Padrão C/N (C/12 UD, C/ 15 UN, C/18)
      const matchC = s.match(/\bC\s*\/\s*(\d+)(?:\s*(?:UD|UN|UNID|CX|PCT))?\b/);
      if (matchC) {
        const n = parseInt(matchC[1], 10);
        if (n > 1) return n;
      }
      // Padrão NxM (10X120G, 24X30G, 12X350ML) — captura N como qtd por embalagem
      const matchX = s.match(/\b(\d+)\s*[X]\s*(\d+)\s*(?:G|GR|KG|ML|L|LT)?\b/);
      if (matchX) {
        const n = parseInt(matchX[1], 10);
        if (n > 1) return n;
      }
      return 1;
    }

    // ---- Parseia um número em formato PT (1.234,56) ou EN (1,234.56) ou simples ----
    function parseNumeroPtEn(str) {
      if (!str) return 0;
      str = str.trim().replace(/\s/g, "");
      // Formato PT: 1.234,56
      if (/^\d{1,3}(\.\d{3})+,\d+$/.test(str))
        return parseFloat(str.replace(/\./g, "").replace(",", "."));
      // Formato EN: 1,234.56
      if (/^\d{1,3}(,\d{3})+\.\d+$/.test(str))
        return parseFloat(str.replace(/,/g, ""));
      // Simples com vírgula: 66,00 / 5,50
      if (str.includes(","))
        return parseFloat(str.replace(/\./g, "").replace(",", "."));
      return parseFloat(str) || 0;
    }

    // ---- Parseia quantidade (suporta "8.000" como 8 e "1,000" como 1) ----
    function parseNumeroQtd(str) {
      if (!str) return 0;
      str = str.trim();
      // "8.000" (milhar com ponto) → trata como inteiro 8
      const mMilhar = str.match(/^(\d+)\.0{3}$/);
      if (mMilhar) return parseInt(mMilhar[1], 10);
      // Número simples
      return parseNumeroPtEn(str) || 0;
    }

    // ---- Limpa a descrição do produto removendo artefatos de OCR ----
    function limparNomeProduto(str) {
      if (!str) return "";
      return str
        .replace(/(?:R\$\s*)?\d+[\.,]\d{2}/g, "")   // remove preços
        .replace(/[|<>{}\[\]\\]/g, " ")               // artefatos OCR
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    // ================================================================
    //  TIPO 1 — Orçamento em Tabela
    //  Formato de linha: CÓDIGO  QTD  DESCRIÇÃO [multiplicador]  UND  VL_UNIT  VL_TOTAL
    //  Ex: "774 3 LEITE INTEGRAL PORTO ALEGRE C/12 UD CX 66,00 198,00"
    // ================================================================
    function parseLinhaTabelaOrcamento(line) {
      // Encontra TODOS os valores monetários (ex: 66,00 e 198,00)
      const priceMatches = [...line.matchAll(/(?:R\$\s*)?(\d+[\.,]\d{2})/g)];
      if (priceMatches.length === 0) return null;

      // O PRIMEIRO preço encontrado é o VL UNITÁRIO (preço da caixa/embalagem)
      const vlUnitNota = parseNumeroPtEn(priceMatches[0][1]);
      if (vlUnitNota <= 0) return null;

      // Tudo antes do primeiro preço é a parte descritiva
      const posFirstPrice = line.indexOf(priceMatches[0][0]);
      let trecho = line.substring(0, posFirstPrice).trim();

      // --- Extrai unidade da nota (última palavra antes dos preços) ---
      let unidadeNota = "";
      const matchUnd = trecho.match(
        /\b(CX|FD|BL|PC|PT|PCT|CAIXA|FARDO|PACOTE|BLOCO|UN|UD|UNID|KG|GR|M2|M|L|LT|LITRO|ML)\s*$/i
      );
      if (matchUnd) {
        unidadeNota = matchUnd[1].toUpperCase();
        trecho = trecho.substring(0, trecho.lastIndexOf(matchUnd[0])).trim();
      }

      // --- Extrai CÓDIGO e QUANTIDADE dos números iniciais ---
      // Padrão: dois números no início → primeiro = CÓDIGO, segundo = QTD
      // Padrão: um número no início → se >= 100 é CÓDIGO (qtd=1), se < 100 é QTD
      let qtdComprada = 1;
      let descricaoRaw = trecho;

      const matchDoisNums = trecho.match(/^\s*(\d{1,6})\s+(\d{1,4})\s+(.+)$/);
      if (matchDoisNums) {
        // Heurística: num1 é o código (geralmente maior ou igual a num2)
        const n1 = parseInt(matchDoisNums[1], 10);
        const n2 = parseInt(matchDoisNums[2], 10);
        // Se n1 >> n2 OU n1 >= 100 → n1=código, n2=qtd
        // Se n1 ~ n2 e ambos pequenos → n1=qtd, ignorar num2 (raro mas possível)
        if (n1 >= 100 || n1 > n2 * 3) {
          qtdComprada = n2;
          descricaoRaw = matchDoisNums[3];
        } else {
          // Ambos pequenos: trata n1 como qtd e n2 como início do nome
          qtdComprada = n1;
          descricaoRaw = matchDoisNums[2] + " " + matchDoisNums[3];
        }
      } else {
        const matchUmNum = trecho.match(/^\s*(\d{1,6})\s+(.+)$/);
        if (matchUmNum) {
          const n = parseInt(matchUmNum[1], 10);
          if (n >= 100) {
            // Provavelmente código de produto → qtd = 1
            qtdComprada = 1;
            descricaoRaw = matchUmNum[2];
          } else {
            // Provavelmente a própria quantidade
            qtdComprada = n;
            descricaoRaw = matchUmNum[2];
          }
        }
      }

      if (qtdComprada <= 0) qtdComprada = 1;

      const nomeLimpo = limparNomeProduto(descricaoRaw);
      if (nomeLimpo.length < 3) return null;
      // Rejeita linhas que são claramente de cabeçalho/rodapé mesmo depois de parsear
      if (deveIgnorarLinha(nomeLimpo.toUpperCase())) return null;

      // --- Cálculo de Embalagem vs Venda Direta ---
      const eEmbalagem = UNIDADES_EMBALAGEM.has(unidadeNota);
      const mult = extrairMultiplicador(descricaoRaw);

      let qtdVenda = qtdComprada;
      let custoUnitVenda = vlUnitNota;

      if (eEmbalagem && mult > 1) {
        // Embalagem fechada com multiplicador conhecido
        // Qtd Venda = qtd comprada × unidades por caixa
        // Custo Unitário = preço da caixa ÷ unidades por caixa
        qtdVenda = qtdComprada * mult;
        custoUnitVenda = vlUnitNota / mult;
      } else if (!eEmbalagem && mult > 1) {
        // Ex: "GULAO QUEIJO SUICO 10X120G" sem coluna CX/FD
        qtdVenda = qtdComprada * mult;
        custoUnitVenda = vlUnitNota / mult;
      }
      // UN/KG/M2 etc. → venda direta, sem alteração

      return {
        nome: nomeLimpo,
        preco: custoUnitVenda,
        quantidade: qtdVenda
      };
    }

    // ================================================================
    //  TIPO 2 — Cupom Térmico de Distribuidora (2 linhas)
    //  Linha 1: DESCRIÇÃO DO PRODUTO (ex: "GULAO QUEIJO SUICO 10X120G")
    //  Linha 2: "QTD UND x VL_UNIT" (ex: "1 FD x 39,49" ou "8.000 UN x 2.75")
    // ================================================================
    // Regex para Linha 2: captura qtd, unidade e preço unitário
    const RE_LINHA2_CUPOM = /^([\d\.,]+)\s*(UN|UD|UNID|KG|GR|M2|M|L|LT|CX|FD|BL|PC|PT|PCT|FARDO|CAIXA|PACOTE)?\s*[xX*]\s*(?:R\$\s*)?([\d\.,]+)/i;

    function tentarParseCupomDuasLinhas(linhaDesc, linhaQtdPreco) {
      const m = linhaQtdPreco.match(RE_LINHA2_CUPOM);
      if (!m) return null;

      const qtdComprada = parseNumeroQtd(m[1]);
      const unidadeNota = (m[2] || "").toUpperCase();
      const vlUnitNota  = parseNumeroPtEn(m[3]);

      if (qtdComprada <= 0 || vlUnitNota <= 0) return null;

      const nomeLimpo = limparNomeProduto(linhaDesc);
      if (nomeLimpo.length < 3) return null;
      if (deveIgnorarLinha(nomeLimpo.toUpperCase())) return null;

      const eEmbalagem = UNIDADES_EMBALAGEM.has(unidadeNota);
      const mult = extrairMultiplicador(linhaDesc);

      let qtdVenda = qtdComprada;
      let custoUnitVenda = vlUnitNota;

      if (mult > 1) {
        // Ex: "GULAO QUEIJO SUICO 10X120G" | 1 FD x 39,49
        // → custo por unidade = 39,49 / 10 = 3,95  |  qtd venda = 1 * 10 = 10
        qtdVenda = qtdComprada * mult;
        custoUnitVenda = vlUnitNota / mult;
      } else if (eEmbalagem) {
        // Embalagem sem multiplicador na descrição
        // → mantém preço da caixa inteira como custo (sem saber subdivisão)
        qtdVenda = qtdComprada;
        custoUnitVenda = vlUnitNota;
      }
      // UN/KG → venda direta

      return {
        nome: nomeLimpo,
        preco: custoUnitVenda,
        quantidade: qtdVenda
      };
    }

    // ================================================================
    //  FUNÇÃO PRINCIPAL DE PARSING — tenta os 3 tipos em sequência
    // ================================================================
    function parseOrcamentoTexto(text) {
      const linhasOriginais = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      const resultados = [];
      const usada = new Array(linhasOriginais.length).fill(false);

      for (let i = 0; i < linhasOriginais.length; i++) {
        if (usada[i]) continue;

        const line = linhasOriginais[i];
        const lineUpper = line.toUpperCase();

        // Ignora linhas de cabeçalho / rodapé
        if (deveIgnorarLinha(lineUpper)) continue;

        // ── TIPO 2: Cupom Térmico ── testa se a PRÓXIMA linha é "QTD x PREÇO"
        if (i + 1 < linhasOriginais.length && !usada[i + 1]) {
          const proximaLinha = linhasOriginais[i + 1];
          const item2L = tentarParseCupomDuasLinhas(line, proximaLinha);
          if (item2L) {
            resultados.push(item2L);
            usada[i] = true;
            usada[i + 1] = true;
            i++; // pula a linha de qtd/preço
            continue;
          }
        }

        // ── TIPO 1: Orçamento em Tabela (linha única com preços) ──
        const item1L = parseLinhaTabelaOrcamento(line);
        if (item1L) {
          resultados.push(item1L);
          usada[i] = true;
          continue;
        }
      }

      return resultados;
    }

    function preencherFormulario(item) {
      document.getElementById("produto").value = item.nome;
      document.getElementById("precoCusto").value = "R$" + item.preco.toFixed(2).replace(".", ",");
      document.getElementById("quantidade").value = item.quantidade;
    }

    function exibirListaItensOCR(itens) {
      const container = document.getElementById("ocrItemsContainer");
      container.style.display = "block";
      
      let html = `<div class="ocr-items-title">📋 Clique em um item para preencher:</div>`;
      itens.forEach((item, index) => {
        html += `
          <div class="ocr-item-chip" onclick="selecionarItemOCR(${index})">
            <span><strong>${item.nome}</strong> (Qtd: ${item.quantidade})</span>
            <span class="price-green">R$ ${item.preco.toFixed(2).replace(".", ",")}</span>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function selecionarItemOCR(index) {
      if (itensDetectadosOCR[index]) {
        preencherFormulario(itensDetectadosOCR[index]);
      }
    }

    window.onload = function () {
      const listaSalva = localStorage.getItem("produtosPadaria");
      if (listaSalva) {
        document.getElementById("listaProdutos").innerHTML = listaSalva;
      }
    };
  </script>
