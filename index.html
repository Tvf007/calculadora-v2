<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora de Preço - Padaria Freitas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
      flex-direction: column;
    }

    .container {
      flex: 1;
      padding: 20px;
      box-sizing: border-box;
      border-bottom: 1px solid #ddd;
    }

    .sidebar {
      flex: 1;
      padding: 20px;
      box-sizing: border-box;
    }

    input, button {
      margin: 10px 0;
      padding: 8px;
      width: 100%;
      box-sizing: border-box;
      transition: transform 0.1s ease-in-out;
    }

    button {
      cursor: pointer;
      border: none;
      color: white;
      font-size: 1em;
    }

    button:active {
      transform: scale(0.95);
    }

    .ocr-buttons-group {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .ocr-buttons-group button {
      flex: 1;
      margin: 0;
      font-weight: bold;
      border-radius: 6px;
      padding: 12px;
      font-size: 0.95em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .camera-btn {
      background: linear-gradient(135deg, #4b6cb7 0%, #182848 100%);
      color: white;
    }

    .camera-btn:hover {
      background: linear-gradient(135deg, #3b5998 0%, #0f1b33 100%);
    }

    .gallery-btn {
      background: linear-gradient(135deg, #6f42c1 0%, #4527a0 100%);
      color: white;
    }

    .gallery-btn:hover {
      background: linear-gradient(135deg, #5e35b1 0%, #311b92 100%);
    }

    .ocr-status {
      margin: 5px 0 15px 0;
      padding: 10px 14px;
      border-radius: 6px;
      background-color: #f0f4f8;
      border: 1px solid #cbd5e1;
      font-size: 0.9em;
      color: #334155;
    }

    .ocr-progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #cbd5e1;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }

    .ocr-progress-bar {
      height: 100%;
      width: 0%;
      background-color: #2563eb;
      transition: width 0.2s ease-in-out;
    }

    .ocr-items-container {
      margin-bottom: 15px;
      padding: 10px;
      background: #f8fafc;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      font-size: 0.9em;
    }

    .ocr-items-title {
      font-weight: bold;
      color: #1e3a8a;
      margin-bottom: 8px;
    }

    .ocr-item-chip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      margin-top: 6px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .ocr-item-chip:hover {
      background: #eff6ff;
      border-color: #2563eb;
    }

    .product-list {
      list-style-type: none;
      padding: 0;
    }

    .product-item {
      display: flex;
      flex-direction: column;
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #e6ffe6;
    }

    .delete-btn {
      background-color: #ff4d4d;
      padding: 3px 8px;
      font-size: 12px;
      align-self: flex-end;
    }

    .save-btn {
      background-color: #28a745;
    }

    .clear-btn {
      background-color: #dc3545;
    }

    .add-product-btn {
      background-color: #28a745;
    }

    .price-green {
      color: green;
      font-weight: bold;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 20px;
      background-color: #581d22;
      padding: 15px;
      border-radius: 8px;
    }

    .logo-container img {
      max-width: 60%;
      height: auto;
      border: 2px solid #ddd;
      border-radius: 5px;
      margin: 0 auto;
    }

    .logo-container h2,
    .logo-container p {
      color: white;
      margin: 5px 0;
    }

    .controls-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .controls-container button {
      padding: 5px 10px;
      font-size: 0.9em;
    }

    @media (min-width: 768px) {
      body {
        flex-direction: row;
      }

      .container {
        border-right: 1px solid #ddd;
        border-bottom: none;
      }

      .sidebar {
        border-left: 1px solid #ddd;
      }

      .logo-container img {
        max-width: 40%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <h2>Calculadora de Preço</h2>
      <p>Padaria Freitas</p>
    </div>

    <!-- Botões de Câmera e Galeria para OCR -->
    <div class="ocr-buttons-group">
      <button type="button" class="camera-btn" onclick="abrirLeitorCamera()">📷 Tirar Foto</button>
      <button type="button" class="gallery-btn" onclick="abrirLeitorGaleria()">🖼️ Escolher da Galeria</button>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="processarImagemOCR(event)" />
    <input type="file" id="galleryInput" accept="image/*" style="display: none;" onchange="processarImagemOCR(event)" />
    
    <div id="ocrStatus" class="ocr-status" style="display: none;"></div>
    <div id="ocrItemsContainer" class="ocr-items-container" style="display: none;"></div>

    <input type="text" id="produto" placeholder="Nome do produto" />
    <input type="text" id="precoCusto" placeholder="Preço de custo (R$)" />
    <input type="number" id="quantidade" placeholder="Quantidade" />
    <button class="add-product-btn" onclick="adicionarProduto()">Adicionar Produto</button>
    <ul class="product-list" id="listaProdutos"></ul>
  </div>
  <div class="sidebar">
    <div class="controls-container">
      <button class="save-btn" onclick="salvarProdutos()">Salvar Lista</button>
      <button class="clear-btn" onclick="limparLista()">Limpar Lista</button>
    </div>
  </div>

  <!-- Áudio do cadastro -->
  <audio id="somCadastro" src="sucesso.mp3" preload="auto"></audio>

  <script>
    const precoCustoInput = document.getElementById("precoCusto");

    precoCustoInput.addEventListener("input", function (e) {
      let valor = e.target.value.replace(/\D/g, "");
      if (!valor) return;
      valor = (parseInt(valor, 10) / 100).toFixed(2);
      e.target.value = "R$" + valor.replace(".", ",");
    });

    function parsePreco(precoFormatado) {
      return parseFloat(precoFormatado.replace("R$", "").replace(".", "").replace(",", ".")) || 0;
    }

    function calcularPrecoVenda(precoCusto, quantidade) {
      const precoPorUnidade = precoCusto / (quantidade || 1);
      let precoVenda;

      if (precoPorUnidade <= 5) {
        precoVenda = precoPorUnidade * 1.75;
      } else {
        precoVenda = precoPorUnidade * 1.5;
      }

      precoVenda = Math.ceil(precoVenda * 4) / 4; // múltiplo de 0,25
      return precoVenda;
    }

    function adicionarProduto() {
      const nomeProduto = document.getElementById("produto").value.trim();
      const precoCustoFormatado = document.getElementById("precoCusto").value.trim();
      const quantidade = parseInt(document.getElementById("quantidade").value.trim()) || 1;

      if (!nomeProduto || !precoCustoFormatado) {
        alert("Por favor, preencha todos os campos.");
        return;
      }

      const precoCusto = parsePreco(precoCustoFormatado);
      const precoVenda = calcularPrecoVenda(precoCusto, quantidade);

      const item = document.createElement("li");
      item.className = "product-item";
      item.innerHTML = `
        <strong>${nomeProduto}</strong>
        <span>Preço de Custo: <strong>R$ ${precoCusto.toFixed(2).replace(".", ",")}</strong></span>
        <span>Quantidade: ${quantidade}</span>
        <span>Preço de Venda: <span class="price-green">R$ ${precoVenda.toFixed(2).replace(".", ",")}</span></span>
        <button class="delete-btn" onclick="this.parentElement.remove()">Remover</button>
      `;

      const lista = document.getElementById("listaProdutos");
      lista.insertBefore(item, lista.firstChild); // adiciona no topo da lista

      // Reproduzir som
      const som = document.getElementById("somCadastro");
      som.currentTime = 0;
      som.play();

      document.getElementById("produto").value = "";
      document.getElementById("precoCusto").value = "";
      document.getElementById("quantidade").value = "";
    }

    function salvarProdutos() {
      const lista = document.getElementById("listaProdutos").innerHTML;
      localStorage.setItem("produtosPadaria", lista);
      alert("Lista salva com sucesso!");
    }

    function limparLista() {
      if (confirm("Tem certeza que deseja limpar a lista?")) {
        document.getElementById("listaProdutos").innerHTML = "";
        localStorage.removeItem("produtosPadaria");
      }
    }

    // --- Lazy Loading do Tesseract.js e Lógica do OCR ---
    let scriptTesseractPromise = null;
    let itensDetectadosOCR = [];

    function carregarTesseractJS() {
      if (window.Tesseract) {
        return Promise.resolve();
      }
      if (scriptTesseractPromise) {
        return scriptTesseractPromise;
      }
      scriptTesseractPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
        script.async = true;
        script.onload = () => resolve();
        script.onerror = () => {
          scriptTesseractPromise = null;
          reject(new Error("Falha ao carregar biblioteca Tesseract.js via CDN"));
        };
        document.head.appendChild(script);
      });
      return scriptTesseractPromise;
    }

    function abrirLeitorCamera() {
      carregarTesseractJS().catch(err => console.warn("Carregando Tesseract...", err));
      document.getElementById("cameraInput").click();
    }

    function abrirLeitorGaleria() {
      carregarTesseractJS().catch(err => console.warn("Carregando Tesseract...", err));
      document.getElementById("galleryInput").click();
    }

    async function processarImagemOCR(event) {
      const fileInput = event.target;
      const file = fileInput.files[0];
      if (!file) return;

      const statusDiv = document.getElementById("ocrStatus");
      const itemsDiv = document.getElementById("ocrItemsContainer");
      
      itemsDiv.style.display = "none";
      itemsDiv.innerHTML = "";
      statusDiv.style.display = "block";
      statusDiv.innerHTML = `
        <div id="ocrStatusText">⌛ Carregando leitor de imagem (Tesseract.js)...</div>
        <div class="ocr-progress-bar-bg"><div id="ocrProgressBar" class="ocr-progress-bar"></div></div>
      `;

      let worker = null;

      try {
        // 1. Carrega dinamicamente a biblioteca se ainda não estiver carregada (timeout 15s)
        const timeoutScript = new Promise((_, reject) =>
          setTimeout(() => reject(new Error("O download do script Tesseract.js demorou demais (timeout 15s).")), 15000)
        );
        await Promise.race([carregarTesseractJS(), timeoutScript]);

        const statusElem = document.getElementById("ocrStatusText");
        if (statusElem) statusElem.innerText = "⌛ Baixando modelo de linguagem em português (por)...";

        // 2. Executa a criação do worker e o OCR com timeout limite de 25 segundos
        const promiseOCR = (async () => {
          worker = await Tesseract.createWorker('por', 1, {
            logger: m => {
              if (m.status === 'recognizing text') {
                const pct = Math.round((m.progress || 0) * 100);
                const textElem = document.getElementById("ocrStatusText");
                const barElem = document.getElementById("ocrProgressBar");
                if (textElem) textElem.innerText = `🔍 Reconhecendo texto... (${pct}%)`;
                if (barElem) barElem.style.width = `${pct}%`;
              } else if (m.status) {
                const textElem = document.getElementById("ocrStatusText");
                if (textElem) textElem.innerText = `⚙️ ${m.status}...`;
              }
            }
          });
          const res = await worker.recognize(file);
          return res;
        })();

        const timeoutOCR = new Promise((_, reject) =>
          setTimeout(() => reject(new Error("Tempo limite excedido ao carregar modelo ou processar imagem (timeout 25s).")), 25000)
        );

        const ret = await Promise.race([promiseOCR, timeoutOCR]);

        const textoReconhecido = ret.data ? ret.data.text || "" : "";
        console.log("Texto OCR reconhecido:", textoReconhecido);

        itensDetectadosOCR = parseOrcamentoTexto(textoReconhecido);

        if (itensDetectadosOCR.length > 0) {
          statusDiv.innerHTML = `✅ <strong>${itensDetectadosOCR.length} item(ns) encontrado(s) na nota!</strong>`;
          preencherFormulario(itensDetectadosOCR[0]);

          if (itensDetectadosOCR.length > 1) {
            exibirListaItensOCR(itensDetectadosOCR);
          }
        } else {
          statusDiv.innerHTML = `⚠️ Não foi possível identificar produtos na imagem. Tente com uma foto mais legível ou com melhor iluminação.`;
        }
      } catch (err) {
        console.error("Erro no processamento OCR:", err);
        statusDiv.innerHTML = `
          <div style="color: #dc3545; font-weight: bold;">❌ Não foi possível carregar o leitor OCR.</div>
          <div style="font-size: 0.85em; margin-top: 4px; color: #555;">
            O download dos dados de idioma ('por') demorou demais ou houve falha na conexão de rede.
          </div>
          <button type="button" onclick="abrirLeitorCamera()" style="margin-top: 8px; padding: 6px 12px; background-color: #2563eb; color: white; border-radius: 4px; cursor: pointer;">🔄 Tentar Novamente</button>
        `;
      } finally {
        if (worker) {
          try {
            await worker.terminate();
          } catch (e) {}
        }
        fileInput.value = ""; // reseta os inputs file
        const galleryInput = document.getElementById("galleryInput");
        if (galleryInput) galleryInput.value = "";
      }
    }

    // --- Parser Especializado em Orçamentos e Cupons de Distribuidora ---
    function parseOrcamentoTexto(text) {
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      const resultados = [];

      // Ignora cabeçalhos e rodapés comuns de distribuidoras e cupons térmicos
      const ignorar = [
        "BUZIM DISTRIBUIDORA", "VENDA SIMPLES", "NAO E DOCUMENTO FISCAL", "NÃO É DOCUMENTO FISCAL",
        "CLIENTE", "PEDIDO", "SUBTOTAL", "TOTAL", "DINHEIRO", "TROCO", "CARTAO", "CARTÃO", "PIX",
        "RECEBIDO", "VALOR PAGO", "VALOR TOTAL", "DADOS PARA ENTREGA", "TRIBUTOS", "FORMA DE PAGAMENTO",
        "DESCONTO", "CNPJ", "CPF", "ENDERECO", "ENDEREÇO", "TELEFONE", "DATA", "HORA", "EMISSAO", 
        "EMISSÃO", "INSCRICAO", "INSCRIÇÃO", "CHAVE", "OBRIGADO", "VOLTE SEMPRE", "NOTA FISCAL", 
        "CUPOM", "BAIRRO", "CIDADE", "IE", "ITEM", "DESCRICAO", "QTD", "VL.UNIT", "VLR.UNIT", "PRECO",
        "CODIGO", "CÓDIGO", "VL.TOTAL", "VLR.TOTAL"
      ];

      // Regex para fórmula de quantidade e preço em duas linhas (ex: "8.000 UN x 2.75")
      const regexFormulaQtdPreco = /(?:^|\s)([\d\.,]+)\s*(?:UN|KG|CX|PCT|G|L|CAIXA|UNID|X)?\s*[xX*]\s*(?:R\$\s*)?([\d\.,]+)/i;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const lineUpper = line.toUpperCase();

        if (ignorar.some(term => lineUpper.includes(term) && !lineUpper.match(/\d+[\.,]\d{2}/))) {
          continue;
        }

        // 1. TENTATIVA COM ESTRUTURA RÍGIDA DE LINHA: [CÓDIGO] [QUANTIDADE] [DESCRIÇÃO] [UND] [VL_UNIT] [VL_TOTAL]
        const itemRigido = parseLinhaOrcamento(line);
        if (itemRigido) {
          resultados.push(itemRigido);
          continue;
        }

        // 2. TENTATIVA COM ESTRUTURA EM DUAS LINHAS (Linha i = Código + Descrição, Linha i+1 = QTD x PREÇO_UNIT)
        if (i + 1 < lines.length) {
          const nextLine = lines[i + 1];
          const matchNext = nextLine.match(regexFormulaQtdPreco);
          if (matchNext) {
            const qtdRaw = matchNext[1];
            const precoRaw = matchNext[2];

            const qtdComprada = parseNumeroQtd(qtdRaw);
            const precoBase = parseNumeroPtEn(precoRaw);

            if (qtdComprada > 0 && precoBase > 0) {
              const nomeLimpo = limparNomeProduto(line);
              if (nomeLimpo.length >= 2) {
                const multiplicador = extrairMultiplicador(line);
                const quantidadeTotalVenda = qtdComprada * multiplicador;
                const precoCustoUnitario = (multiplicador > 1 && precoBase > 10) ? (precoBase / multiplicador) : precoBase;

                resultados.push({
                  nome: nomeLimpo,
                  preco: precoCustoUnitario,
                  quantidade: quantidadeTotalVenda
                });
                i++; // Avança a linha pois foi consumida
                continue;
              }
            }
          }
        }
      }

      return resultados;
    }

    function parseLinhaOrcamento(line) {
      // Procura todos os valores monetários da linha (ex: 66,00 198,00 ou 66,00)
      const priceMatches = [...line.matchAll(/(?:R\$\s*)?(\d+[\.,]\d{2})/gi)];
      if (priceMatches.length === 0) return null;

      const vlUnitarioNota = parseNumeroPtEn(priceMatches[0][1]);
      const vlTotalNota = priceMatches.length > 1 ? parseNumeroPtEn(priceMatches[priceMatches.length - 1][1]) : vlUnitarioNota;

      if (vlUnitarioNota <= 0) return null;

      // Isola o trecho inicial antes dos preços
      let trechoInicial = line.replace(/(?:R\$\s*)?\d+[\.,]\d{2}.*$/i, "").trim();
      
      // Extrai a coluna de Unidade da Nota (ex: CX, FD, BL, PC, PT, PCT, UN, UD, KG, M2)
      let unidadeNota = "";
      const matchUnd = trechoInicial.match(/\s+(CX|FD|BL|PC|PT|PCT|UN|UD|KG|M2|CAIXA|PACOTE|UNID|LATA|LOTE|CX\.|FD\.|BL\.|PC\.|PT\.|PCT\.|UN\.)\s*$/i);
      if (matchUnd) {
        unidadeNota = matchUnd[1].toUpperCase().replace(".", "");
        trechoInicial = trechoInicial.replace(/\s+(?:CX|FD|BL|PC|PT|PCT|UN|UD|KG|M2|CAIXA|PACOTE|UNID|LATA|LOTE|CX\.|FD\.|BL\.|PC\.|PT\.|PCT\.|UN\.)\s*$/i, "").trim();
      }

      // Analisa os números no início:
      // Ex: "774 3 LEITE INTEGRAL 1 LT C/12 UD" -> num1 = 774 (CÓDIGO), num2 = 3 (QTD COMPRADA)
      const matchNumIniciais = trechoInicial.match(/^\s*(\d{1,6})(?:\s+(\d{1,6}))?\s+(.+)$/);

      let codigo = "";
      let qtdComprada = 1;
      let descricaoRaw = trechoInicial;

      if (matchNumIniciais) {
        const num1 = matchNumIniciais[1];
        const num2 = matchNumIniciais[2];
        const restStr = matchNumIniciais[3];

        if (num2 !== undefined) {
          codigo = num1;
          qtdComprada = parseInt(num2, 10);
          descricaoRaw = restStr;
        } else {
          if (parseInt(num1, 10) >= 100) {
            codigo = num1;
            qtdComprada = 1;
            descricaoRaw = restStr;
          } else {
            qtdComprada = parseInt(num1, 10);
            descricaoRaw = restStr;
          }
        }
      }

      if (qtdComprada <= 0) qtdComprada = 1;

      const nomeLimpo = limparNomeProduto(descricaoRaw);
      if (nomeLimpo.length < 2) return null;

      // Identifica se é Embalagem Fechada (CX, FD, BL, PC, PT, PCT) e o multiplicador por embalagem (ex: C/12 UD, C/15 UD, C/18, 10X120G)
      const eEmbalagemFechada = ["CX", "FD", "BL", "PC", "PT", "PCT", "CAIXA", "PACOTE"].includes(unidadeNota);
      const unidadesPorEmbalagem = extrairMultiplicador(descricaoRaw);

      let quantidadeTotalVenda = qtdComprada;
      let custoUnitarioVenda = vlUnitarioNota;

      if ((eEmbalagemFechada || unidadesPorEmbalagem > 1) && unidadesPorEmbalagem > 1) {
        // Regra 1: Embalagem Fechada com multiplicador
        // Quantidade Total de Venda = Quantidade Comprada x Unidades por Embalagem
        quantidadeTotalVenda = qtdComprada * unidadesPorEmbalagem;
        // Custo Unitário por Item de Venda = Valor Unitário da Caixa / Unidades por Embalagem
        custoUnitarioVenda = vlUnitarioNota / unidadesPorEmbalagem;
      } else {
        // Regra 2: Peça Única ou Venda por Unidade (UN, M2, etc.)
        quantidadeTotalVenda = qtdComprada;
        custoUnitarioVenda = vlUnitarioNota;
      }

      return {
        nome: nomeLimpo,
        preco: custoUnitarioVenda,       // Preenchido diretamente no formulário (ex: R$ 5,50)
        quantidade: quantidadeTotalVenda // Preenchido diretamente no formulário (ex: 36 unidades)
      };
    }

    function extrairMultiplicador(str) {
      if (!str) return 1;
      // 1. Padrões como "C/12 UD", "C/12UD", "C/ 12 UD", "C/15 UD", "C/18", "C/ 18"
      const matchC = str.match(/\bC\s*\/\s*(\d+)(?:\s*UD|\s*UN|\s*UNID)?\b/i);
      if (matchC && parseInt(matchC[1], 10) > 0) {
        return parseInt(matchC[1], 10);
      }
      // 2. Padrões como "10X120G", "12X350ML", "10 X 100G"
      const matchX = str.match(/\b(\d+)\s*[xX]\s*\d+\s*(?:g|gr|gramas|kg|ml|l|lt)?\b/i);
      if (matchX && parseInt(matchX[1], 10) > 0) {
        return parseInt(matchX[1], 10);
      }
      return 1;
    }

    function parseNumeroQtd(str) {
      if (!str) return 1;
      str = str.trim();
      if (/^\d+[.,]0{3}$/.test(str)) {
        return parseInt(str, 10);
      }
      const num = parseNumeroPtEn(str);
      return num > 0 ? num : 1;
    }

    function parseNumeroPtEn(str) {
      if (!str) return 0;
      str = str.trim();
      if (/^\d{1,3}(\.\d{3})+,\d+$/.test(str)) {
        return parseFloat(str.replace(/\./g, "").replace(",", "."));
      }
      if (/^\d{1,3}(,\d{3})+\.\d+$/.test(str)) {
        return parseFloat(str.replace(/,/g, ""));
      }
      if (str.includes(",")) {
        return parseFloat(str.replace(/\./g, "").replace(",", "."));
      }
      return parseFloat(str);
    }

    function limparNomeProduto(str) {
      if (!str) return "";
      return str
        .replace(/^\s*\d{1,6}\s+/, "") // Remove código inicial solto se houver
        .replace(/(?:R\$\s*)?\d+[\.,]\d{2}/gi, "")
        .replace(/[^\w\sÀ-ú\/\.]/gi, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function preencherFormulario(item) {
      document.getElementById("produto").value = item.nome;
      document.getElementById("precoCusto").value = "R$" + item.preco.toFixed(2).replace(".", ",");
      document.getElementById("quantidade").value = item.quantidade;
    }

    function exibirListaItensOCR(itens) {
      const container = document.getElementById("ocrItemsContainer");
      container.style.display = "block";
      
      let html = `<div class="ocr-items-title">📋 Clique em um item para preencher:</div>`;
      itens.forEach((item, index) => {
        html += `
          <div class="ocr-item-chip" onclick="selecionarItemOCR(${index})">
            <span><strong>${item.nome}</strong> (Qtd: ${item.quantidade})</span>
            <span class="price-green">R$ ${item.preco.toFixed(2).replace(".", ",")}</span>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function selecionarItemOCR(index) {
      if (itensDetectadosOCR[index]) {
        preencherFormulario(itensDetectadosOCR[index]);
      }
    }

    window.onload = function () {
      const listaSalva = localStorage.getItem("produtosPadaria");
      if (listaSalva) {
        document.getElementById("listaProdutos").innerHTML = listaSalva;
      }
    };
  </script>
</body>
</html>
